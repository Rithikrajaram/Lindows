                        <div class="text-[10px] text-slate-400">Mirror downloads automatically</div>
                      </div>
                      <div class="w-9 h-5 rounded-full bg-brand-500 relative"><span class="w-4 h-4 rounded-full bg-white absolute top-0.5 right-0.5"></span></div>
                    </div>

                    <div class="p-3 rounded-lg bg-slate-900/80 border border-white/10 flex items-center justify-between">
                      <div>
                        <div class="text-xs font-bold text-white">Prompt Before Syncing</div>
                        <div class="text-[10px] text-slate-400">Show notification with Yes/No</div>
                      </div>
                      <div class="w-9 h-5 rounded-full bg-brand-500 relative"><span class="w-4 h-4 rounded-full bg-white absolute top-0.5 right-0.5"></span></div>
                    </div>

                    <div class="p-3 rounded-lg bg-slate-900/80 border border-white/10 space-y-2">
                      <div class="flex justify-between text-xs font-semibold text-white">
                        <span>Target Windows Download Folder</span>
                      </div>
                      <div class="p-2 rounded bg-slate-950 border border-brand-500/50 text-xs font-mono text-brand-300 truncate">
                        /run/media/rithik/Windows/Users/Asus/Downloads
                      </div>
                      <div class="flex gap-1.5 pt-1">
                        <span class="text-[9px] px-2 py-0.5 rounded bg-brand-500/20 text-brand-300 border border-brand-500/40 font-semibold">✨ Auto-Detected</span>
                        <span class="text-[9px] px-2 py-0.5 rounded bg-slate-800 text-slate-400">/mnt/windows</span>
                      </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-center pt-1">
                      <div class="p-2.5 rounded-lg bg-slate-900/80 border border-white/10">
                        <div class="text-base font-extrabold text-brand-400">42</div>
                        <div class="text-[9px] text-slate-400 uppercase font-semibold">Files Synced</div>
                      </div>
                      <div class="p-2.5 rounded-lg bg-slate-900/80 border border-white/10">
                        <div class="text-xs font-semibold text-white truncate">driver.run</div>
                        <div class="text-[9px] text-slate-400 uppercase font-semibold">Last Synced</div>
                      </div>
                    </div>
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* Lintos Desktop App Section (Lindows Access) */}
          <section id="desktop" class="py-20 px-6 border-t border-white/10 bg-slate-950/40">
            <div class="max-w-6xl mx-auto">
              
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                
                {/* Visual Display for Lindows Access */}
                <div class="glass-panel p-6 sm:p-8 rounded-2xl border border-white/15 space-y-6 order-2 lg:order-1">
                  <div class="flex items-center justify-between border-b border-white/10 pb-4">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-xl bg-brand-600/20 border border-brand-500/30 text-brand-400 flex items-center justify-center font-bold text-lg">
                        📂
                      </div>
                      <div>
                        <h3 class="text-base font-bold text-white">Lindows Access</h3>
                        <p class="text-xs text-slate-400">Cross-Platform System Tray Daemon</p>
                      </div>
                    </div>
                    <span class="text-xs font-mono text-purple-400 bg-purple-500/10 px-2 py-1 rounded border border-purple-500/20">
                      pystray + PIL
                    </span>
                  </div>

                  {/* Menu Simulation */}
                  <div class="p-4 rounded-xl bg-slate-900/90 border border-white/10 space-y-2 font-medium text-sm">
                    <p class="text-xs font-mono text-slate-400 uppercase tracking-wider mb-2">Simulated Tray Context Menu</p>
                    
                    <div class="p-2.5 rounded-lg bg-brand-600/20 border border-brand-500/40 text-brand-300 flex items-center justify-between cursor-pointer hover:bg-brand-600/30">
                      <div class="flex items-center gap-2">
                        <span>📂</span>
                        <span class="font-bold">Open Windows Drive</span>
                      </div>
                      <span class="text-[10px] text-brand-400 font-mono bg-brand-500/10 px-1.5 py-0.5 rounded">Linux</span>
                    </div>

                    <div class="p-2.5 rounded-lg bg-slate-800/80 hover:bg-slate-800 text-slate-300 flex items-center justify-between cursor-pointer">
                      <div class="flex items-center gap-2">
                        <span>🐧</span>
                        <span>Open Linux Files (WSL)</span>
                      </div>
                      <span class="text-[10px] text-slate-400 font-mono bg-slate-700 px-1.5 py-0.5 rounded">Windows</span>
                    </div>

                    <div class="p-2.5 rounded-lg bg-slate-800/80 hover:bg-slate-800 text-slate-300 flex items-center justify-between cursor-pointer">
                      <div class="flex items-center gap-2">
                        <span>🔄</span>
                        <span>Refresh Mounts</span>
                      </div>
                    </div>

                    <div class="p-2.5 rounded-lg bg-slate-800/80 hover:bg-slate-800 text-slate-400 flex items-center justify-between cursor-pointer border-t border-slate-700/60 pt-3">
                      <div class="flex items-center gap-2">
                        <span>✕</span>
                        <span>Exit Lindows Access</span>
                      </div>
                    </div>
                  </div>

                  <div class="p-3 rounded-lg bg-brand-500/10 border border-brand-500/20 text-xs text-brand-300">
                    💡 <strong>Smart Auto-Mount:</strong> If your Windows NTFS partition is not mounted, clicking <em>"Open Windows Drive"</em> automatically calls <code class="bg-brand-950 px-1 rounded">udisksctl</code> or mounts <code class="bg-brand-950 px-1 rounded">/mnt/windows</code> and opens the file manager directly at your Windows User profile!
                  </div>
                </div>

                <div class="space-y-6 order-1 lg:order-2">
                  <div class="inline-flex items-center gap-2 px-3 py-1 rounded-md bg-purple-500/10 text-purple-400 text-xs font-bold">
                    <span>SYSTEM TRAY APPLICATION</span>
                  </div>
                  <h2 class="text-3xl sm:text-4xl font-extrabold text-white leading-tight">
                    Lindows Access: 1-Click Disk Explorer
                  </h2>
                  <p class="text-slate-300 text-base leading-relaxed">
                    Ever booted into Linux and needed to grab a file from your Windows partition, but had to open the Disks app, find the partition, mount it, and navigate through deep folders? 
                    <strong>Lindows Access</strong> sits quietly in your system tray and does it in a single click.
                  </p>

                  <div class="space-y-4 pt-2">
                    <div class="p-4 rounded-xl bg-slate-900 border border-white/10 space-y-2">
                      <div class="text-xs font-bold text-white flex items-center gap-2">
                        <span class="text-brand-400">⚡</span>
                        <span>Quick Launch in Terminal</span>
                      </div>
                      <div class="flex items-center justify-between bg-black/60 p-2.5 rounded font-mono text-xs text-brand-300">
                        <code>python3 lintos-desktop-app/lindows_access_tray.py</code>
                        <button 
                          onClick={() => copyToClipboard("python3 lintos-desktop-app/lindows_access_tray.py", "tray-cmd")}
                          class="ml-2 px-2 py-1 bg-brand-600/30 hover:bg-brand-600 text-brand-300 hover:text-white rounded text-[10px] transition-all"
                        >
                          {copiedCmd === "tray-cmd" ? "✓ Copied" : "Copy"}
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* Developer Mode Installation Guide Section */}
          <section id="guide" class="py-20 px-6 border-t border-white/10">
            <div class="max-w-4xl mx-auto space-y-12">
              
              <div class="text-center space-y-3">
                <span class="text-xs font-bold text-brand-400 tracking-wider uppercase">Step-by-Step Setup</span>
                <h2 class="text-3xl sm:text-4xl font-extrabold text-white">Developer Mode Installation Guide</h2>
                <p class="text-slate-400 text-sm sm:text-base">Get the full Lintos ecosystem running on your Linux and Windows system in under 2 minutes.</p>
              </div>

              {/* Step Flow */}
              <div class="space-y-6">
                
                {/* Step 1 */}
                <div class="glass-panel p-6 rounded-2xl border border-white/10 space-y-4">
                  <div class="flex items-center gap-3">
                    <span class="w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-sm">1</span>
                    <h3 class="text-lg font-bold text-white">Load Chrome Extension in Developer Mode</h3>
                  </div>
                  <div class="text-sm text-slate-300 space-y-2 pl-11">
                    <p>1. Open Google Chrome (or Chromium, Brave, Edge, Vivaldi).</p>
                    <p>2. Navigate to <code class="text-brand-300 bg-slate-900 px-2 py-0.5 rounded font-mono">chrome://extensions</code> in your address bar.</p>
                    <p>3. Toggle on <strong class="text-white">Developer mode</strong> in the top-right corner.</p>
                    <p>4. Click <strong class="text-white">Load unpacked</strong> (top-left) and select the <code class="text-brand-300 bg-slate-900 px-2 py-0.5 rounded font-mono">lintos-extension/</code> folder.</p>
                    <p>5. Copy your 32-character <strong class="text-brand-400 font-mono">Extension ID</strong> shown on the card.</p>
                  </div>
                </div>

                {/* Step 2 */}
                <div class="glass-panel p-6 rounded-2xl border border-white/10 space-y-4">
                  <div class="flex items-center gap-3">
                    <span class="w-8 h-8 rounded-full bg-purple-600 text-white flex items-center justify-center font-bold text-sm">2</span>
                    <h3 class="text-lg font-bold text-white">Register the Linux Native Messaging Host</h3>
                  </div>
                  <div class="text-sm text-slate-300 space-y-3 pl-11">
                    <p>Open your terminal inside the <code class="text-brand-300 bg-slate-900 px-2 py-0.5 rounded font-mono">lintos-desktop-app/</code> directory and run the 1-click installer with your Extension ID:</p>
                    
                    <div class="flex items-center justify-between bg-black/60 p-3 rounded-lg font-mono text-xs text-brand-300 border border-slate-800">
                      <code>./install_host.sh &lt;YOUR_EXTENSION_ID&gt;</code>
                      <button 
                        onClick={() => copyToClipboard("./install_host.sh <YOUR_EXTENSION_ID>", "host-cmd")}
                        class="ml-2 px-2.5 py-1 bg-brand-600/30 hover:bg-brand-600 text-brand-300 hover:text-white rounded text-xs transition-all font-sans"
                      >
                        {copiedCmd === "host-cmd" ? "✓ Copied" : "Copy"}
                      </button>
                    </div>

                    <p class="text-xs text-slate-400">
                      This automatically configures <code class="font-mono text-slate-300">com.dualsync.bridge.json</code> and installs it for Chrome, Brave, Chromium, and Edge.
                    </p>
                  </div>
                </div>

                {/* Step 3 */}
                <div class="glass-panel p-6 rounded-2xl border border-white/10 space-y-4">
                  <div class="flex items-center gap-3">
                    <span class="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-sm">3</span>
                    <h3 class="text-lg font-bold text-white">Test Connection &amp; Enjoy Auto-Sync</h3>
                  </div>
                  <div class="text-sm text-slate-300 space-y-2 pl-11">
                    <p>1. Click the DualSync icon in your Chrome toolbar.</p>
                    <p>2. Click <strong class="text-white">"Test Bridge"</strong> — you will see a green <span class="text-emerald-400 font-bold">Connected</span> status badge.</p>
                    <p>3. Click the auto-detected Windows path preset or type your mount directory.</p>
                    <p>4. Click <strong class="text-white">"Save Settings"</strong>. Download any file and experience seamless dual-boot mirroring!</p>
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* Dual-Boot Troubleshooting Section */}
          <section id="troubleshooting" class="py-20 px-6 border-t border-white/10 bg-slate-950/40">
            <div class="max-w-4xl mx-auto space-y-8">
              
              <div class="text-center space-y-2">
                <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">Crucial Dual-Boot Tips</span>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white">Troubleshooting &amp; Pro-Tips</h2>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="p-6 rounded-xl bg-slate-900 border border-amber-500/30 space-y-3">
                  <div class="flex items-center gap-2 text-amber-400 font-bold text-sm">
                    <span>⚠️</span>
                    <span>1. Turn Off Windows "Fast Startup"</span>
                  </div>
                  <p class="text-xs text-slate-300 leading-relaxed">
                    Windows Fast Startup leaves NTFS partitions locked in a hibernated, read-only state. When Linux boots, the drive is mounted as read-only (<code class="font-mono text-amber-300">ro</code>).
                  </p>
                  <div class="text-xs text-slate-400 bg-black/40 p-2.5 rounded border border-slate-800">
                    <strong>Fix:</strong> Windows Control Panel &rarr; Power Options &rarr; "Choose what the power buttons do" &rarr; uncheck "Turn on fast startup".
                  </div>
                </div>

                <div class="p-6 rounded-xl bg-slate-900 border border-brand-500/30 space-y-3">
                  <div class="flex items-center gap-2 text-brand-400 font-bold text-sm">
                    <span>⚡</span>
                    <span>2. Auto-Mount in /etc/fstab</span>
                  </div>
                  <p class="text-xs text-slate-300 leading-relaxed">
                    To have your Windows drive permanently mounted with full write permissions at boot, add your partition UUID to <code class="font-mono text-brand-300">/etc/fstab</code>:
                  </p>
                  <div class="text-[11px] font-mono text-slate-300 bg-black/40 p-2 rounded border border-slate-800 overflow-x-auto">
                    UUID=... /mnt/windows ntfs-3g defaults,uid=1000,gid=1000 0 0
                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* Footer */}
          <footer class="border-t border-white/10 py-12 px-6 glass-panel">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-sm text-slate-400">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 to-purple-600 flex items-center justify-center text-white font-bold text-xs">
                  L
                </div>
                <span>Lintos Dual-Boot Ecosystem &bull; Open Source</span>
              </div>
              <div class="flex items-center gap-6 text-xs">
                <a href="https://github.com/Rithikrajaram/Lindows" target="_blank" rel="noreferrer" class="hover:text-white transition-colors">GitHub Repository</a>
                <a href="#extension" class="hover:text-white transition-colors">Extension</a>
                <a href="#desktop" class="hover:text-white transition-colors">Desktop Tray</a>
                <a href="#guide" class="hover:text-white transition-colors">Installation Guide</a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
